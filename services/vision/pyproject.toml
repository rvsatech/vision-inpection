[project]
name = "vision-inspect-vision"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # o formatter cuida do comprimento de linha

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
