name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  GO_VERSION: '1.24'
  PYTHON_VERSION: '3.12'

jobs:
  # ── API NestJS: lint, tipos, unitários, integração (Postgres + Redis reais) ──
  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: vision, POSTGRES_PASSWORD: vision, POSTGRES_DB: vision_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vision" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://vision:vision@localhost:5432/vision_test
      REDIS_URL_TEST: redis://localhost:6379/15
      # Chaves de TESTE do Stripe (opcionais). Sem elas, o teste de checkout real é pulado.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_PRICE_PRO: ${{ secrets.STRIPE_TEST_PRICE_PRO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run lint -w apps/api
      - run: npm run typecheck -w apps/api
      - name: Testes unitários
        run: npm test -w apps/api -- --coverage
      - name: Testes de integração
        run: npm run test:integration -w apps/api
      - name: Migrations aplicam do zero (prisma migrate deploy)
        working-directory: apps/api
        env: { DATABASE_URL: 'postgresql://vision:vision@localhost:5432/vision_migrate', DIRECT_DATABASE_URL: 'postgresql://vision:vision@localhost:5432/vision_migrate' }
        run: |
          PGPASSWORD=vision psql -h localhost -U vision -d vision_test -c "CREATE DATABASE vision_migrate"
          npx prisma migrate deploy
      - name: Schema ⇄ migrations sem divergência
        # Informativo até a 1ª execução verde: confirme a flag na versão do Prisma em uso.
        continue-on-error: true
        working-directory: apps/api
        env: { DATABASE_URL: 'postgresql://vision:vision@localhost:5432/vision_migrate', DIRECT_DATABASE_URL: 'postgresql://vision:vision@localhost:5432/vision_migrate' }
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run build -w apps/api

  # ── Frontend Next.js ──
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run lint -w apps/web
      - run: npm run typecheck -w apps/web
      - run: npm run build -w apps/web
        env: { API_URL: 'http://localhost:4000' }

  # ── Worker Go ──
  worker:
    name: Worker (Go)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}', cache-dependency-path: services/worker/go.sum }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Testes (fila, retry, DLQ, webhook, scheduler) com race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go build -o bin/worker ./cmd/worker

  # ── Serviço de visão Python ──
  vision:
    name: Visão (Python)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/vision } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ env.PYTHON_VERSION }}', cache: pip, cache-dependency-path: services/vision/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Testes (acurácia sobre dados sintéticos + contrato da API)
        run: pytest

  # ── Imagens Docker ──
  docker:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    needs: [api, web, worker, vision]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build

  # ── E2E: stack completa (docker compose) + Playwright ──
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: cp .env.example .env
      - name: Subir stack completa
        run: docker compose up -d --build --wait --wait-timeout 300 web worker vision
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Testes E2E
        run: npm run test:e2e -w apps/web
      - name: Logs da stack (em caso de falha)
        if: failure()
        run: docker compose logs --tail=200
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }
